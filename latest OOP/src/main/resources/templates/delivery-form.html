<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery assignment</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container page narrow"><p class="eyebrow">DELIVERY MANAGEMENT</p><h1 th:text="${delivery.id == null ? 'Assign a delivery' : 'Update delivery'}">Delivery</h1><p class="error" th:if="${error}" th:text="${error}"></p><form class="form-card" action="/deliveries/save" method="post"><input type="hidden" name="id" th:value="${delivery.id}"><label>Order<select name="orderId" required><option value="">Select an order</option><option th:each="o : ${orders}" th:value="${o.id}" th:text="${o.id + ' · ' + o.customerName + ' · ' + o.pizzaName}" th:selected="${o.id == delivery.orderId}"></option></select></label><label>Rider name<input name="riderName" required th:value="${delivery.riderName}"></label><label>Rider phone<input name="riderPhone" required th:value="${delivery.riderPhone}"></label><label>Estimated arrival<input name="eta" type="datetime-local" required th:value="${delivery.eta}"></label><label>Status<select name="status" required><option th:selected="${delivery.status == 'Assigned'}">Assigned</option><option th:selected="${delivery.status == 'Picked up'}">Picked up</option><option th:selected="${delivery.status == 'In transit'}">In transit</option><option th:selected="${delivery.status == 'Delivered'}">Delivered</option><option th:selected="${delivery.status == 'Cancelled'}">Cancelled</option></select></label><label>Notes<textarea name="notes" th:text="${delivery.notes}"></textarea></label><div class="form-actions"><button class="btn" type="submit">Save delivery</button><a class="text-link" href="/deliveries">Cancel</a></div></form></main></body></html>
