<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery tracking</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container page"><div class="section-head"><div><p class="eyebrow">DELIVERY MANAGEMENT</p><h1>Assignments and tracking</h1><p class="muted">Assign a rider and update each delivery as it moves to the customer.</p></div><a class="btn" href="/deliveries/new">+ Assign delivery</a></div><p class="success" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p><div class="table-wrap"><table><thead><tr><th>Delivery</th><th>Order</th><th>Customer</th><th>Rider</th><th>Phone</th><th>ETA</th><th>Status</th><th>Notes</th><th>Actions</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(deliveries)}"><td colspan="9">No deliveries assigned yet.</td></tr><tr th:each="d : ${deliveries}"><td th:text="${d.id}"></td><td th:text="${d.orderId}"></td><td th:text="${d.customerName}"></td><td th:text="${d.riderName}"></td><td th:text="${d.riderPhone}"></td><td th:text="${d.eta}"></td><td><span class="status-pill" th:text="${d.status}"></span></td><td th:text="${d.notes}"></td><td class="actions"><a th:href="@{/deliveries/edit/{id}(id=${d.id})}">Edit</a><form th:action="@{/deliveries/delete/{id}(id=${d.id})}" method="post" onsubmit="return confirm('Remove this delivery assignment?')"><button class="link danger" type="submit">Delete</button></form></td></tr></tbody></table></div></main></body></html>
