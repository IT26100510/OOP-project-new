<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container page"><div class="section-head"><div><p class="eyebrow">USER MANAGEMENT</p><h1>Accounts</h1></div><a class="btn" href="/users/new">+ Add account</a></div><p class="success" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead><tbody><tr th:each="u : ${users}"><td th:text="${u.id}"></td><td th:text="${u.name}"></td><td th:text="${u.email}"></td><td th:text="${u.role}"></td><td class="actions"><a th:href="@{/users/edit/{id}(id=${u.id})}">Edit</a><form th:action="@{/users/delete/{id}(id=${u.id})}" method="post" onsubmit="return confirm('Delete this account?')"><button class="link danger" type="submit">Delete</button></form></td></tr></tbody></table></div></main></body></html>
