spring.application.name=pizza-delivery-management
server.port=8080
spring.thymeleaf.cache=false


# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/pizza_studio?createDatabaseIfNotExist=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:change-me}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false