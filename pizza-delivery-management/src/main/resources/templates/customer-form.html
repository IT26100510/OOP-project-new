
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Customer Form</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div th:replace="~{fragments :: nav}"></div>

<main class="container page narrow">

    <p class="eyebrow">CUSTOMER RECORDS</p>

    <h1 th:text="${customer.id == null ? 'Register customer' : 'Update customer'}"></h1>

    <form class="form-card" action="/customers/save" method="post">

        <input type="hidden" name="id" th:value="${customer.id}">

        <label>
            Full name
            <input
                    name="name"
                    required
                    th:value="${customer.name}"
            >
        </label>

        <label>
            Email
            <input
                    type="email"
                    name="email"
                    required
                    th:value="${customer.email}"
            >
        </label>

        <label>
            Phone
            <input
                    name="phone"
                    required
                    th:value="${customer.phone}"
            >
        </label>

        <label>
            Delivery address
            <textarea
                    name="address"
                    required
                    th:text="${customer.address}"
            ></textarea>
        </label>

        <div class="form-actions">

            <button class="btn" type="submit">
                Save customer
            </button>

            <a class="text-link" href="/customers">
                Cancel
            </a>

        </div>

    </form>

</main>

</body>
</html>
