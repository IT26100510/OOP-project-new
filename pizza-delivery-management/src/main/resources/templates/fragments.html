
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<nav th:fragment="nav" class="nav">

    <a class="brand" href="/">
        🍕 PIZZA HOUSE
    </a>

    <div>

        <a href="/">Home</a>

        <a href="/menu">Menu</a>

        <span th:if="${session.user != null and session.user.role == 'ADMIN'}">

                <a href="/orders">Orders</a>

                <a href="/customers">Customers</a>

            </span>

        <a
                th:if="${session.user == null}"
                href="/login"
        >
            Login
        </a>

        <form
                th:if="${session.user != null}"
                action="/logout"
                method="post"
                style="display: inline"
        >

            <button class="link" type="submit">
                Logout
            </button>

        </form>

    </div>

</nav>

</body>
</html>
