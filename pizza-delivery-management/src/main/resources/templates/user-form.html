<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container page narrow"><p class="eyebrow">ACCOUNT MANAGEMENT</p><h1 th:text="${account.id == null ? 'Create account' : 'Edit account'}">Account</h1><p class="error" th:if="${error}" th:text="${error}"></p><form class="form-card" action="/users/save" method="post"><input type="hidden" name="id" th:value="${account.id}"><label>Account type<select id="accountRole" name="role" onchange="toggleAccountFields()" th:disabled="${account.id != null}"><option value="CUSTOMER" th:selected="${account.role == 'CUSTOMER'}">Customer</option><option value="ADMIN" th:selected="${account.role == 'ADMIN'}">Administrator</option></select></label><input type="hidden" name="role" th:if="${account.id != null}" th:value="${account.role}"><label>Full name<input name="name" required th:value="${account.name}"></label><label>Email<input type="email" name="email" required th:value="${account.email}"></label><label>Password <span class="muted" th:if="${account.id != null}">(leave blank to keep current)</span><input type="password" name="password" th:required="${account.id == null}" minlength="8"></label><div id="customerFields" th:style="${account.role == 'CUSTOMER' ? '' : 'display:none'}"><label>Phone<input id="accountPhone" name="phone" th:value="${account.phone}"></label><label>Address<textarea id="accountAddress" name="address" th:text="${account.address}"></textarea></label></div><div id="adminFields" th:style="${account.role == 'ADMIN' ? '' : 'display:none'}"><label>Staff code<input id="accountStaffCode" name="staffCode" th:value="${account.staffCode}"></label></div><div class="form-actions"><button class="btn" type="submit">Save account</button><a class="text-link" href="/users">Cancel</a></div></form></main><script>
function toggleAccountFields() {
    const role = document.getElementById('accountRole').value;
    const customer = role === 'CUSTOMER';
    document.getElementById('customerFields').style.display = customer ? '' : 'none';
    document.getElementById('adminFields').style.display = customer ? 'none' : '';
    document.getElementById('accountPhone').required = customer && !document.querySelector('[name="id"]').value;
    document.getElementById('accountAddress').required = customer && !document.querySelector('[name="id"]').value;
    document.getElementById('accountStaffCode').required = !customer && !document.querySelector('[name="id"]').value;
}
toggleAccountFields();
</script></body></html>
