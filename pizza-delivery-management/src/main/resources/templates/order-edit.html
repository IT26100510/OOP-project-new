<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit order</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container page narrow"><p class="eyebrow">ORDER MANAGEMENT</p><h1>Edit order <span th:text="${order.id}"></span></h1><form class="form-card" th:action="@{/orders/update/{id}(id=${order.id})}" method="post"><label>Pizza<select name="pizzaName" required><option th:each="p : ${pizzas}" th:value="${p.id}" th:text="${p.name + ' · Rs. ' + p.price}" th:selected="${p.name == order.pizzaName}"></option></select></label><label>Quantity<input type="number" name="quantity" min="1" required th:value="${order.quantity}"></label><p class="muted">The total is recalculated from the current menu price.</p><div class="form-actions"><button class="btn" type="submit">Save changes</button><a class="text-link" href="/orders">Cancel</a></div></form></main></body></html>
