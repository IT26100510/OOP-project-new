
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Customers</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div th:replace="~{fragments :: nav}"></div>

<main class="container page">

    <div class="section-head">

        <div>
            <p class="eyebrow">CUSTOMER RECORDS</p>
            <h1>Customers</h1>
        </div>

        <a class="btn" href="/customers/new">
            + Add customer
        </a>

    </div>

    <form class="search" method="get">

        <input
                name="q"
                placeholder="Search name or email"
                th:value="${q}"
        >

        <button class="btn small" type="submit">
            Search
        </button>

    </form>

    <div class="table-wrap">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="c : ${customers}">

                <td th:text="${c.id}"></td>
                <td th:text="${c.name}"></td>
                <td th:text="${c.email}"></td>
                <td th:text="${c.phone}"></td>
                <td th:text="${c.address}"></td>

                <td class="actions">

                    <a th:href="@{/customers/edit/{id}(id=${c.id})}">
                        Edit
                    </a>

                    <form
                            th:action="@{/customers/delete/{id}(id=${c.id})}"
                            method="post"
                            onsubmit="return confirm('Delete customer?')"
                    >

                        <button class="link danger" type="submit">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
