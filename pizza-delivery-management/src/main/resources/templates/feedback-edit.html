<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Edit feedback</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div th:replace="~{fragments :: nav}"></div>

<main class="container page narrow">

    <p class="eyebrow">FEEDBACK MANAGEMENT</p>

    <h1>Edit review</h1>

    <form class="form-card"
          th:action="@{/feedback/update/{id}(id=${item.feedbackId})}"
          method="post">

        <label>
            Rating

            <select name="rating">

                <option value="5"
                        th:selected="${item.rating == 5}">
                    5 - Excellent
                </option>

                <option value="4"
                        th:selected="${item.rating == 4}">
                    4 - Good
                </option>

                <option value="3"
                        th:selected="${item.rating == 3}">
                    3 - Average
                </option>

                <option value="2"
                        th:selected="${item.rating == 2}">
                    2 - Poor
                </option>

                <option value="1"
                        th:selected="${item.rating == 1}">
                    1 - Very poor
                </option>

            </select>
        </label>

        <label>
            Comment

            <textarea name="comment"
                      required
                      th:text="${item.comment}">
            </textarea>
        </label>

        <div class="form-actions">

            <button class="btn" type="submit">
                Save review
            </button>

            <a class="text-link" href="/feedback">
                Cancel
            </a>

        </div>

    </form>

</main>

</body>
</html>
