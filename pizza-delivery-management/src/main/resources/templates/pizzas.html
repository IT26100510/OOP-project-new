<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Pizza Menu</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>

<main class="container page">
    <div class="section-head">
        <div>
            <p class="eyebrow">PIZZA HOUSE</p>
            <h1>Our Menu</h1>
            <p class="muted">Freshly made favourites, baked just for you.</p>
        </div>
        <a class="btn" th:if="${session.user.role == 'ADMIN'}" href="/admin/pizzas/new">+ Add pizza</a>
    </div>

    <p class="success" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="pizza-grid menu-pizza-grid">
        <article class="pizza-card menu-pizza-card" th:each="p : ${pizzas}">
            <div class="menu-pizza-image">
                <img th:if="${#strings.containsIgnoreCase(p.name, 'margherita')}"
                     src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=900&q=85"
                     alt="Margherita pizza">
                <img th:if="${#strings.containsIgnoreCase(p.name, 'pepperoni')}"
                     src="https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=900&q=85"
                     alt="Pepperoni pizza">
                <img th:if="${#strings.containsIgnoreCase(p.name, 'four cheese')}"
                     src="https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?auto=format&fit=crop&w=900&q=85"
                     alt="Four cheese pizza">
                <img th:if="${#strings.containsIgnoreCase(p.name, 'veggie')}"
                     src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=900&q=85"
                     alt="Vegetable pizza">
                <img th:if="${#strings.containsIgnoreCase(p.name, 'bbq')}"
                     src="https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=900&q=85"
                     alt="BBQ chicken pizza">
                <img th:unless="${#strings.containsIgnoreCase(p.name, 'margherita') or #strings.containsIgnoreCase(p.name, 'pepperoni') or #strings.containsIgnoreCase(p.name, 'four cheese') or #strings.containsIgnoreCase(p.name, 'veggie') or #strings.containsIgnoreCase(p.name, 'bbq')}"
                     src="https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=900&q=85"
                     alt="Freshly baked pizza">
                <span class="menu-unavailable" th:if="${!p.available}">Currently unavailable</span>
            </div>

            <div class="pizza-info">
                <div class="row">
                    <h3 th:text="${p.name}"></h3>
                    <strong th:text="'Rs. ' + ${p.price}"></strong>
                </div>
                <p th:text="${p.description}"></p>
                <p class="muted" th:text="'Size: ' + ${p.size}"></p>
                <span class="availability" th:text="${p.available ? 'AVAILABLE' : 'UNAVAILABLE'}"
                      th:classappend="${!p.available} ? ' unavailable' : ''"></span>

                <div class="menu-pizza-actions">
                    <a class="btn small" th:if="${session.user.role == 'CUSTOMER' and p.available}"
                       th:href="@{/orders/new(pizzaId=${p.id})}">Place an order</a>
                    <span class="admin-actions" th:if="${session.user.role == 'ADMIN'}">
                        <a th:href="@{/admin/pizzas/edit/{id}(id=${p.id})}">Edit</a>
                        <form th:action="@{/admin/pizzas/delete/{id}(id=${p.id})}" method="post"
                              onsubmit="return confirm('Delete this pizza?')">
                            <button class="link danger" type="submit">Delete</button>
                        </form>
                    </span>
                </div>
            </div>
        </article>
    </div>
</main>
</body>
</html>
