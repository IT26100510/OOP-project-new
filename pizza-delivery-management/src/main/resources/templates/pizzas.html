<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizza Menu</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container page"><div class="section-head"><div><p class="eyebrow">PIZZA HOUSE</p><h1>Our Menu</h1></div><a class="btn" th:if="${session.user.role == 'ADMIN'}" href="/admin/pizzas/new">+ Add pizza</a></div><p class="success" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Price</th><th>Availability</th><th>Actions</th></tr></thead><tbody><tr th:each="p : ${pizzas}"><td th:text="${p.id}"></td><td th:text="${p.name}"></td><td th:text="${p.description}"></td><td th:text="'Rs. '+${p.price}"></td><td th:text="${p.available?'Yes':'No'}"></td><td class="actions"><span th:if="${session.user.role == 'ADMIN'}"><a th:href="@{/admin/pizzas/edit/{id}(id=${p.id})}">Edit</a><form th:action="@{/admin/pizzas/delete/{id}(id=${p.id})}" method="post" onsubmit="return confirm('Delete this pizza?')"><button class="link danger" type="submit">Delete</button></form></span><a th:if="${session.user.role == 'CUSTOMER' and p.available}" th:href="@{/orders/new(pizzaId=${p.id})}">Place an order</a></td></tr></tbody></table></div></main></body></html>
