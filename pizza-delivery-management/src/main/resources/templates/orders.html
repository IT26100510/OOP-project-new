<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container page"><div class="section-head"><div><p class="eyebrow">DELIVERY MANAGEMENT</p><h1>Orders</h1></div><a class="btn" href="/orders/new">+ New order</a></div><p class="success" th:if="${message}" th:text="${message}"></p><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Pizza</th><th>Qty</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="o : ${orders}"><td th:text="${o.id}"></td><td th:text="${o.customerName}"></td><td th:text="${o.pizzaName}"></td><td th:text="${o.quantity}"></td><td th:text="'Rs. '+${o.total}"></td><td><form th:action="@{/orders/status/{id}(id=${o.id})}" method="post"><select name="status" onchange="this.form.submit()"><option th:each="s : ${ {'Received','Preparing','Out for delivery','Delivered','Cancelled'} }" th:value="${s}" th:text="${s}" th:selected="${s==o.status}"></option></select></form></td><td><form th:action="@{/orders/delete/{id}(id=${o.id})}" method="post"><button class="link danger">Delete</button></form></td></tr></tbody></table></div></main></body></html>
