<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Orders</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>

<main class="container page">
    <div class="section-head">
        <div>
            <p class="eyebrow">DELIVERY MANAGEMENT</p>
            <h1 th:text="${isAdmin} ? 'Orders' : 'My Orders'">Orders</h1>
        </div>
        <a class="btn" href="/orders/new" th:if="${!isAdmin}">+ New order</a>
    </div>

    <p class="success" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Pizza</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Order status</th>
                <th>Delivery status</th>
                <th>Rider</th>
                <th>ETA</th>
                <th th:if="${isAdmin}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td th:colspan="${isAdmin ? 10 : 9}">No orders found yet.</td>
            </tr>
            <tr th:each="o : ${orders}">
                <td th:text="${o.id}"></td>
                <td th:text="${o.customerName}"></td>
                <td th:text="${o.pizzaName}"></td>
                <td th:text="${o.quantity}"></td>
                <td th:text="'Rs. ' + ${o.total}"></td>
                <td>
                    <span th:if="${isAdmin}">
                        <form th:action="@{/orders/status/{id}(id=${o.id})}" method="post">
                            <select name="status" onchange="this.form.submit()">
                                <option th:each="s : ${ {'Received','Preparing','Out for delivery','Delivered','Cancelled'} }"
                                        th:value="${s}" th:text="${s}" th:selected="${s == o.status}"></option>
                            </select>
                        </form>
                    </span>
                    <span th:if="${!isAdmin}" th:text="${o.status}"></span>
                </td>
                
                <td th:if="${isAdmin}" class="actions">
                    <a th:href="@{/orders/edit/{id}(id=${o.id})}">Edit</a>
                    <form th:action="@{/orders/delete/{id}(id=${o.id})}" method="post">
                        <button class="link danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
