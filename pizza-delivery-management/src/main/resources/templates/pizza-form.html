<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizza form</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container page narrow"><p class="eyebrow">MENU MANAGEMENT</p><h1 th:text="${pizza.id==null?'Add a pizza':'Edit pizza'}">Pizza</h1><form class="form-card" action="/admin/pizzas/save" method="post"><input type="hidden" name="id" th:value="${pizza.id}"><label>Pizza name<input name="name" required th:value="${pizza.name}"></label><label>Description<textarea name="description" required th:text="${pizza.description}"></textarea></label><label>Price (LKR)<input type="number" name="price" min="1" step="0.01" required th:value="${pizza.price}"></label><label>Size<select name="size"><option th:selected="${pizza.size=='Medium'}">Medium</option><option th:selected="${pizza.size=='Large'}">Large</option></select></label><label class="check"><input type="checkbox" name="available" value="true" th:checked="${pizza.available}"> Available for ordering</label><div class="form-actions"><button class="btn" type="submit">Save pizza</button><a class="text-link" href="/admin/pizzas">Cancel</a></div></form></main></body></html>
