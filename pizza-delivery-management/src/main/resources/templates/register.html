<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Pizza House</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container page narrow"><p class="eyebrow">JOIN PIZZA HOUSE</p><h1>Create account</h1><p class="error" th:if="${error}" th:text="${error}"></p><form class="form-card" action="/register" method="post"><label>Full name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Phone<input name="phone" required></label><label>Delivery address<textarea name="address" required></textarea></label><label>Password<input type="password" name="password" minlength="6" required></label><div class="form-actions"><button class="btn">Register</button><a class="text-link" href="/login">Already registered? Login</a></div></form></main></body></html>
